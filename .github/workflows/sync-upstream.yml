# Fork only: merge botnick/telegram-media-downloader main into this fork's
# main once a week, run the Go tests, push, then build the Docker image.
# A merge conflict or a failing test stops the job before anything is pushed
# (GitHub emails the repo owner); resolve it locally and push by hand.
name: Sync upstream

on:
  schedule:
    - cron: '0 18 * * 6' # Sunday 02:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'botnick/telegram-media-downloader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/botnick/telegram-media-downloader.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/main -m "Merge upstream $(git rev-parse --short upstream/main)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        if: steps.merge.outputs.changed == 'true'
        with:
          go-version-file: core-service/go.mod
          cache-dependency-path: core-service/go.sum
      - name: Test merged tree
        if: steps.merge.outputs.changed == 'true'
        working-directory: core-service
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Push and build image
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:main
          gh workflow run docker.yml --ref main
